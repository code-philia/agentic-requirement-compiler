[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-compiler"
version = "1.1.0"
description = "Agentic Requirement Compiler"
requires-python = ">=3.11"
dependencies = [
  "aiofiles",
  "openai",
  "requests",
  "python-dotenv",
  "pyyaml",
  "pydantic",
  "colorama",
  "jsonschema",
  "tiktoken",
  "httpx[socks]",
  "deepagents",
  "langchain-openai",
]

[project.scripts]
arc = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "agents",
  "agents.*",
  "app_type_handler",
  "app_type_handler.*",
  "arcbench_agent_runtime",
  "arcbench_agent_runtime.*",
  "context",
  "context.*",
  "core",
  "core.*",
  "tools",
  "tools.*",
]

[tool.setuptools.package-data]
templates = ["**/*", "**/.*"]
